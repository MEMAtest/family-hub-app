name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: dummy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # next dev compiles API routes lazily, but generating the client up front
      # removes a whole class of "Prisma client not initialised" flakiness.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run unit tests
        run: npm run test -- --runInBand

      - name: Run AI smoke tests
        run: npm run test:smoke

      # The calendar journeys stub the family APIs, so they need no database and
      # can run on every PR. The rest of the E2E suite still waits on a
      # DATABASE_URL secret.
      - name: Run calendar E2E journeys
        run: npm run test:e2e -- tests/e2e/calendar-recurrence.spec.ts

      - name: Upload E2E artefacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: calendar-e2e-trace
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      # Remaining E2E tests skipped - require DATABASE_URL secret to be configured
      # - name: Run Playwright end-to-end tests
      #   run: npm run test:e2e

      # - name: Run bugfix regression suite
      #   run: npm run test:bugfixes
