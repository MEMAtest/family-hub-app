name: Independent User Journey Review

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: user-journey-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  user-journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: playwright
          POSTGRES_PASSWORD: playwright
          POSTGRES_DB: family_hub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U playwright -d family_hub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://playwright:playwright@127.0.0.1:5432/family_hub_test
      TEST_DATABASE_URL: postgresql://playwright:playwright@127.0.0.1:5432/family_hub_test
      ANTHROPIC_API_KEY: dummy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Use verified npm version
        run: npm install --global npm@11.7.0

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare isolated database
        run: npx prisma db push --skip-generate

      - name: Run independent user journeys
        run: npm run test:e2e:user-journeys

      - name: Upload journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: user-journey-review-${{ github.run_id }}
          path: |
            journey-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
